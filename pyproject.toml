[project]
name = "entity-detection-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.5",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "basic"
